[package]
name = "wattson"
version = "0.3.0"
edition = "2021"
description = "Universal digital PSU monitoring library — read real-time power consumption via serial protocols"
authors = ["ExoMind Team"]
license = "CCOPL-1.0"
repository = "https://github.com/exomind-team/wattson"
readme = "README.md"
keywords = ["psu", "power-supply", "serial", "monitoring", "energy"]
categories = ["hardware-support", "embedded"]
exclude = [
    "logs/**",
    "tools/**",
    "target/**",
    "wattson.toml",
    "wattson_history.json",
    "wattson_gui.json",
    "**/tests/snapshots/**/*.diff.png",
    "**/tests/snapshots/**/*.new.png",
]

[dependencies]
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
plotters = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tower-http = { version = "0.6", features = ["cors"] }
# Keep Linux window backends enabled when opting out of eframe defaults.
# 在关闭 eframe 默认特性时，显式保留 Linux 所需的 x11 / wayland 后端。
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.34"
egui_plot = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
env_logger = "0.11"
egui_kittest = { version = "0.34", features = ["eframe", "wgpu", "snapshot"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "wattson"
path = "src/main.rs"

[[example]]
name = "json_dump"
path = "examples/json_dump.rs"
