[package]
name = "wattson"
version = "0.3.0"
edition = "2021"
description = "Universal digital PSU monitoring library — read real-time power consumption via serial protocols"
authors = ["ExoMind Team"]
license = "CCOPL-1.0"
repository = "https://github.com/exomind-team/wattson"
readme = "README.md"
keywords = ["psu", "power-supply", "serial", "monitoring", "energy"]
categories = ["hardware-support", "embedded"]
exclude = [
    "logs/**",
    "tools/**",
    "target/**",
    "wattson.toml",
    "wattson_history.json",
    "wattson_gui.json",
    "**/tests/snapshots/**/*.diff.png",
    "**/tests/snapshots/**/*.new.png",
]

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:egui_plot", "dep:image"]
tui = ["dep:ratatui", "dep:crossterm"]
chart = ["dep:plotters"]
cli = ["dep:clap"]
server = ["dep:axum", "dep:tokio", "dep:tower-http"]
config = ["dep:toml", "dep:dirs"]
history = ["config", "dep:chrono"]
runtime = ["history"]
full = ["gui", "tui", "chart", "cli", "server", "history", "runtime"]

[dependencies]
# Core (always compiled)
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# Optional
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
egui = { version = "0.34", optional = true }
egui_plot = { version = "0.35", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
plotters = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
toml = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
dirs = { version = "6", optional = true }

[dev-dependencies]
env_logger = "0.11"
egui_kittest = { version = "0.34", features = ["eframe", "wgpu", "snapshot"] }
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "wattson"
path = "src/main.rs"
required-features = ["cli", "server"]

[[example]]
name = "json_dump"
path = "examples/json_dump.rs"
