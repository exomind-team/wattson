name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wattson.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wattson
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wattson
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libfontconfig1-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../wattson-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../wattson-${{ matrix.target }}.zip ${{ matrix.artifact }}
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: wattson-${{ matrix.target }}
          path: wattson-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" wattson-* --clobber
          else
            gh release create "$tag" wattson-* --title "$tag" --generate-notes
          fi
