[package]
name = "wattson"
version = "0.2.0"
edition = "2021"
description = "Universal digital PSU monitoring library — read real-time power consumption via serial protocols"
authors = ["ExoMind Team"]
license = "CCOPL-1.0"
repository = "https://github.com/exomind-team/wattson"
readme = "README.md"
keywords = ["psu", "power-supply", "serial", "monitoring", "energy"]
categories = ["hardware-support", "embedded"]

[dependencies]
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
plotters = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
env_logger = "0.11"

[[bin]]
name = "wattson"
path = "src/main.rs"

[[example]]
name = "json_dump"
path = "examples/json_dump.rs"
