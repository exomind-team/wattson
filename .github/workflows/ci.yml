name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libfontconfig1-dev
      # Core build (no optional deps — fastest smoke test)
      - name: Build (core, no-default-features)
        run: cargo build --no-default-features
      # Full build (default = ["full"]) — same as before
      - name: Build (full)
        run: cargo build --release --features full
      - name: Test (full)
        run: cargo test --features full
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: wattson-${{ matrix.os }}
          path: |
            target/release/wattson
            target/release/wattson.exe

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libfontconfig1-dev
      # full features: --all-targets is safe here because tests are gated on their features
      - name: Clippy (full)
        run: cargo clippy --all-targets --features full -- -D warnings
      # core only: restrict to --lib so tests requiring gui/runtime are skipped
      - name: Clippy (core, no-default-features)
        run: cargo clippy --lib --no-default-features -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
